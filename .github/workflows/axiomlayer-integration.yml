name: AxiomLayer npm / Node integration

on:
  pull_request:
  push:
    branches:
      - latest
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiomlayer-npm-node-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Pinned runtime and upstream candidate
    if: github.repository == 'axiomlayer/npm-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the candidate to a full SHA
        id: candidate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            schedule|workflow_dispatch)
              git fetch --no-tags https://github.com/npm/cli.git latest
              candidate=$(git rev-parse FETCH_HEAD)
              ;;
            *)
              candidate=$(git rev-parse HEAD)
              ;;
          esac
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$candidate^{commit}"
          printf 'sha=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          printf 'candidate=%s\n' "$candidate"

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Verify the pinned runtime and candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          nix-shell .github/axiomlayer/shell.nix --run \
            'bash .github/axiomlayer/verify-integration.sh "$CANDIDATE_SHA"'
